spring.application.name=entitle-backend
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8095}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

entitle.auth.session-data-url=${EMERGENT_AUTH_SESSION_URL:}
entitle.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
entitle.llm.api-key=${EMERGENT_LLM_KEY:}
entitle.llm.model=${LLM_MODEL:claude-sonnet-5-5}
entitle.llm.app-id=${APP_URL:}
entitle.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8001,http://127.0.0.1:3000,http://127.0.0.1:8001,*}
